# Run everything:   docker compose up --build
# API:              http://localhost:8080
# Swagger UI:       http://localhost:8080/swagger-ui.html
#
# The values below are DEVELOPMENT defaults. For any real deployment copy
# .env.example to .env and override every secret (JWT_SECRET, DB_PASSWORD, ...).
services:
  postgres:
    image: postgres:16-alpine
    container_name: shofini-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shofiniakol}
      POSTGRES_USER: ${DB_USERNAME:-shofini}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shofini_dev_password}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shofini} -d ${DB_NAME:-shofiniakol}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: shofini-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-shofiniakol}
      DB_USERNAME: ${DB_USERNAME:-shofini}
      DB_PASSWORD: ${DB_PASSWORD:-shofini_dev_password}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8080}
      # Loads demo restaurants/offers taken from the app's mock data. Remove for production.
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
      # DEV ONLY: every phone can log in with this OTP (no SMS provider is wired yet).
      # Leave empty in production.
      OTP_DEV_FIXED_CODE: ${OTP_DEV_FIXED_CODE:-123456}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-+963900000001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
